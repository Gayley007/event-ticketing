syntax = "proto3";

// Ticket bounded context (Service A).
// A ticket references an event only by its ID. Event details are fetched
// from the Event Service over gRPC whenever they are needed.
package ticket;

option go_package = "github.com/Gayley007/event-ticketing/gen/ticketpb;ticketpb";

import "google/protobuf/timestamp.proto";

service TicketService {
  rpc CreateTicket(CreateTicketRequest) returns (Ticket);
  rpc GetTicket(GetTicketRequest) returns (Ticket);
  rpc ListTickets(ListTicketsRequest) returns (ListTicketsResponse);
  rpc UpdateTicket(UpdateTicketRequest) returns (Ticket);
  rpc DeleteTicket(DeleteTicketRequest) returns (DeleteTicketResponse);
}

message Ticket {
  string id = 1;                                // UUID, generated by the database
  string event_id = 2;                          // reference into the Event Service
  string holder_name = 3;
  string holder_email = 4;
  int32 quantity = 5;                           // number of seats on this ticket
  string status = 6;                            // CONFIRMED or CANCELLED
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;

  // Read-time enrichment from the Event Service. Never stored by this service.
  EventSummary event = 9;
  // Set when event details could not be loaded (graceful degradation).
  string warning = 10;
}

// EventSummary is the Ticket context's view of an event.
message EventSummary {
  string id = 1;
  string name = 2;
  string venue = 3;
  google.protobuf.Timestamp starts_at = 4;
  double price = 5;
}

message CreateTicketRequest {
  string event_id = 1;
  string holder_name = 2;
  string holder_email = 3;
  int32 quantity = 4;
}

message GetTicketRequest {
  string id = 1;
}

message ListTicketsRequest {
  string event_id = 1;                          // optional filter
}

message ListTicketsResponse {
  repeated Ticket tickets = 1;
}

// UpdateTicketRequest replaces the editable fields of a ticket (PUT semantics).
// The event a ticket belongs to cannot be changed.
message UpdateTicketRequest {
  string id = 1;
  string holder_name = 2;
  string holder_email = 3;
  int32 quantity = 4;
  string status = 5;
}

message DeleteTicketRequest {
  string id = 1;
}

message DeleteTicketResponse {}
