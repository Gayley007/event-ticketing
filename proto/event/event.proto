syntax = "proto3";

// Event bounded context (Service B).
// The Event Service is the single owner of event data. Other services may
// only read events through this API - never through the event database.
package event;

option go_package = "github.com/Gayley007/event-ticketing/gen/eventpb;eventpb";

import "google/protobuf/timestamp.proto";

service EventService {
  rpc CreateEvent(CreateEventRequest) returns (Event);
  rpc GetEvent(GetEventRequest) returns (Event);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc UpdateEvent(UpdateEventRequest) returns (Event);
  rpc DeleteEvent(DeleteEventRequest) returns (DeleteEventResponse);
}

message Event {
  string id = 1;                                // UUID, generated by the database
  string name = 2;
  string venue = 3;
  google.protobuf.Timestamp starts_at = 4;
  int32 capacity = 5;                           // total number of seats
  double price = 6;                             // price per ticket (Nu.)
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message CreateEventRequest {
  string name = 1;
  string venue = 2;
  google.protobuf.Timestamp starts_at = 3;
  int32 capacity = 4;
  double price = 5;
}

message GetEventRequest {
  string id = 1;
}

message ListEventsRequest {}

message ListEventsResponse {
  repeated Event events = 1;
}

// UpdateEventRequest replaces every editable field of an event (PUT semantics).
message UpdateEventRequest {
  string id = 1;
  string name = 2;
  string venue = 3;
  google.protobuf.Timestamp starts_at = 4;
  int32 capacity = 5;
  double price = 6;
}

message DeleteEventRequest {
  string id = 1;
}

message DeleteEventResponse {}
